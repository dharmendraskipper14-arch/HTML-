<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Glow</title>
    <style>
        body {
            margin: 0;
            height: 100%;
            width: 100%;

            background-color: #111; /* Dark background makes the glow pop */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .heart img {
            position: relative;
            max-width: 100%;
            height: 100%;
            /* Correct drop-shadow: X-offset Y-offset Blur Color */
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
            animation: pulse 1s ease infinite;
            transition: filter 0.3s ease;
        }

        .heart img:hover {
            /* Intense glow transition on hover */
            filter: drop-shadow(0 0 25px #7fff00) drop-shadow(0 0 45px #00ffca);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
            }
            50% {
                transform: scale(1.2);
                /* Shadow intensifies at the peak of the beat */
                filter: drop-shadow(0 0 30px rgba(255, 0, 0, 1)) drop-shadow(0 0 50px rgba(255, 0, 0, 0.5));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="heart">
            <img src="ChatGPT Image Aug 1, 2026, 11_05_24 PM.png" alt="Heart">
            
        </div>
    </div>
</body>
</html>
