<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Personal Finance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #10160f;
    --bg-2: #0c110b;
    --surface: #1b241a;
    --surface-2: #232e21;
    --line: rgba(237,230,214,0.14);
    --line-strong: rgba(237,230,214,0.28);
    --parchment: #ede6d6;
    --parchment-dim: #b7ae9c;
    --gold: #c9a227;
    --gold-soft: rgba(201,162,39,0.16);
    --sage: #7fae93;
    --sage-soft: rgba(127,174,147,0.16);
    --brick: #c3705a;
    --brick-soft: rgba(195,112,90,0.16);
    --radius: 3px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent, transparent 35px, var(--line) 36px),
      var(--bg);
    color: var(--parchment);
    font-family: var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--gold-soft); color: var(--parchment); }
  button, input, select{ font-family: inherit; }
  button{ cursor:pointer; }
  input, select{
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    color: var(--parchment);
    border-radius: var(--radius);
    padding: 9px 11px;
    font-size: 14px;
    outline: none;
    width:100%;
  }
  input:focus, select:focus{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
  input::placeholder{ color: var(--parchment-dim); opacity:.7; }
  label{ font-size:12px; letter-spacing:.04em; text-transform:uppercase; color: var(--parchment-dim); display:block; margin-bottom:5px; }

  .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .credit{ color: var(--sage); }
  .debit{ color: var(--brick); }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:400px; background: var(--surface);
    border:1px solid var(--line-strong); border-radius: var(--radius);
    padding: 36px 32px; position:relative;
  }
  .auth-card::before{
    content:""; position:absolute; top:0; left:28px; width:2px; height:100%;
    background: var(--line);
  }
  .ledger-mark{
    font-family: var(--font-display); font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    color: var(--gold); margin-bottom:6px;
  }
  h1.brand{ font-family: var(--font-display); font-weight:600; font-size:32px; margin:0 0 4px; }
  .subtitle{ color: var(--parchment-dim); font-size:13.5px; margin:0 0 28px; }
  .field{ margin-bottom:16px; }
  .auth-toggle{ display:flex; gap:2px; margin-bottom:24px; background:var(--bg-2); border-radius:var(--radius); padding:3px; border:1px solid var(--line); }
  .auth-toggle button{
    flex:1; background:transparent; border:none; color:var(--parchment-dim); padding:8px; border-radius:2px; font-size:13px; font-weight:600;
  }
  .auth-toggle button.active{ background: var(--gold-soft); color: var(--gold); }
  .btn-primary{
    width:100%; background: var(--gold); color: #1a1408; border:none; padding:11px; border-radius:var(--radius);
    font-weight:700; font-size:14px; letter-spacing:.02em; margin-top:6px;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .auth-error{ color: var(--brick); font-size:13px; margin-top:12px; min-height:16px; }

  /* ---------- App shell ---------- */
  #app-screen{ display:none; min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:210px; flex-shrink:0; background: var(--bg-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:26px 0;
  }
  .sidebar-brand{ padding:0 24px 22px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .sidebar-brand .ledger-mark{ margin-bottom:2px; }
  .sidebar-brand .who{ font-size:13px; color:var(--parchment); font-weight:600; margin-top:10px;}
  .sidebar-brand .who span{ color:var(--parchment-dim); font-weight:400; display:block; font-size:11.5px; margin-top:1px; }
  .tab{
    display:flex; align-items:center; gap:10px; padding:11px 24px; color: var(--parchment-dim);
    font-size:13.5px; font-weight:600; border:none; background:transparent; text-align:left;
    border-left:3px solid transparent; position:relative;
  }
  .tab .num{ font-family:var(--font-mono); font-size:11px; color: inherit; opacity:.6; }
  .tab:hover{ color: var(--parchment); background: rgba(237,230,214,0.03); }
  .tab.active{ color: var(--gold); border-left-color: var(--gold); background: var(--gold-soft); }
  .sidebar-foot{ margin-top:auto; padding:16px 24px 0; border-top:1px solid var(--line); }
  .logout-btn{ background:none; border:none; color: var(--parchment-dim); font-size:12.5px; font-weight:600; padding-top:14px; }
  .logout-btn:hover{ color: var(--brick); }

  .main{ flex:1; padding: 34px 40px 60px; max-width:1080px; }
  .page-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px;}
  .page-head h2{ font-family:var(--font-display); font-weight:600; font-size:26px; margin:0; }
  .page-head .stamp{ font-family:var(--font-mono); font-size:12px; color:var(--parchment-dim); border:1px solid var(--line-strong); padding:5px 10px; border-radius:var(--radius); }

  .grid-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--parchment-dim); margin-bottom:8px; }
  .card .amount{ font-family:var(--font-mono); font-size:22px; font-weight:600; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:22px; }
  .panel h3{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:0 0 16px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:26px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--parchment-dim); padding:0 8px 10px; border-bottom:1px solid var(--line-strong); font-weight:600;}
  tbody td{ padding:10px 8px; border-bottom:1px solid var(--line); }
  tbody tr:hover{ background: rgba(237,230,214,0.03); }
  td.amt{ text-align:right; }
  th.amt{ text-align:right; }
  .type-pill{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; padding:2px 7px; border-radius:10px; }
  .type-pill.income{ background:var(--sage-soft); color:var(--sage); }
  .type-pill.expense{ background:var(--brick-soft); color:var(--brick); }
  .type-pill.savings{ background:var(--gold-soft); color:var(--gold); }
  .del-btn{ background:none; border:none; color:var(--parchment-dim); font-size:16px; padding:2px 6px; }
  .del-btn:hover{ color:var(--brick); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .form-grid .field.full{ grid-column: 1/-1; }
  .type-select{ display:flex; gap:8px; }
  .type-opt{ flex:1; padding:9px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--bg-2); text-align:center; font-size:12.5px; font-weight:700; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:.03em; }
  .type-opt.sel-income.active{ border-color:var(--sage); color:var(--sage); background:var(--sage-soft); }
  .type-opt.sel-expense.active{ border-color:var(--brick); color:var(--brick); background:var(--brick-soft); }
  .type-opt.sel-savings.active{ border-color:var(--gold); color:var(--gold); background:var(--gold-soft); }

  .filters{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filters select, .filters input{ width:auto; min-width:130px; }

  .empty{ text-align:center; padding:40px 10px; color:var(--parchment-dim); font-size:13.5px; }
  .empty .big{ font-family:var(--font-display); font-size:17px; color:var(--parchment); margin-bottom:6px; }

  .chart-wrap{ position:relative; height:260px; }

  .ai-box{ background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--radius); padding:20px; margin-top:18px; }
  .ai-box h4{ font-family:var(--font-display); font-size:15px; margin:0 0 10px; color:var(--gold); }
  .ai-tip{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .ai-tip:last-child{ border-bottom:none; }
  .ai-tip .bullet{ color:var(--gold); font-family:var(--font-mono); flex-shrink:0; }
  .budget-bar-row{ margin-bottom:12px; }
  .budget-bar-row .bblabel{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .budget-bar-track{ height:7px; background:var(--bg-2); border-radius:4px; overflow:hidden; }
  .budget-bar-fill{ height:100%; background:var(--gold); }
  .loading-line{ color:var(--parchment-dim); font-size:13.5px; font-style:italic; }
  .err-line{ color:var(--brick); font-size:13.5px; }

  @media (max-width: 760px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:12px 0; align-items:center; }
    .sidebar-brand{ display:none; }
    .sidebar-foot{ margin:0; padding:0 16px; border:none; }
    .tab{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .tab.active{ border-bottom-color:var(--gold); }
    .main{ padding:22px 16px 50px; }
    .grid-cards{ grid-template-columns:repeat(2,1fr); }
    .row2{ grid-template-columns:1fr; }
    .form-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="ledger-mark">Est. Today · Vol. I</div>
    <h1 class="brand">Ledger</h1>
    <p class="subtitle">A quiet place to keep your accounts in order.</p>

    <div class="auth-toggle">
      <button id="tab-login" class="active" onclick="setAuthMode('login')">Sign in</button>
      <button id="tab-signup" onclick="setAuthMode('signup')">Open an account</button>
    </div>

    <div class="field">
      <label>Username</label>
      <input id="auth-username" placeholder="e.g. priya" autocomplete="username">
    </div>
    <div class="field">
      <label>Passphrase</label>
      <input id="auth-password" type="password" placeholder="At least 4 characters" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="auth-submit" onclick="submitAuth()">Sign in</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="app-screen">
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="ledger-mark">Ledger</div>
        <div class="who" id="sidebar-who">—<span id="sidebar-sub"></span></div>
      </div>
      <button class="tab active" data-view="dashboard" onclick="setView('dashboard')"><span class="num">01</span> Dashboard</button>
      <button class="tab" data-view="add" onclick="setView('add')"><span class="num">02</span> Add Entry</button>
      <button class="tab" data-view="records" onclick="setView('records')"><span class="num">03</span> Records</button>
      <button class="tab" data-view="analyzer" onclick="setView('analyzer')"><span class="num">04</span> Analyzer</button>
      <div class="sidebar-foot">
        <button class="logout-btn" onclick="logout()">Sign out ↦</button>
      </div>
    </div>
    <div class="main" id="main-content"></div>
  </div>
</div>

<script>
/* ============================================================
   STORAGE HELPERS
============================================================ */
async function storageGet(key){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return 'h'+Math.abs(h).toString(36);
}

/* ============================================================
   STATE
============================================================ */
let authMode = 'login';
let currentUser = null;
let records = [];
let currentView = 'dashboard';
let selectedMonth = new Date().toISOString().slice(0,7); // YYYY-MM

const INCOME_CATS   = ['Salary','Freelance','Business','Investment','Gift','Other'];
const EXPENSE_CATS  = ['Housing','Food & Groceries','Transport','Utilities','Health','Entertainment','Shopping','Education','Debt Payment','Other'];
const SAVINGS_CATS  = ['Emergency Fund','Retirement','Investment','Goal Savings','Other'];
let draftType = 'expense';

/* ============================================================
   AUTH
============================================================ */
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-signup').classList.toggle('active', mode==='signup');
  document.getElementById('auth-submit').textContent = mode==='login' ? 'Sign in' : 'Open account';
  document.getElementById('auth-error').textContent = '';
}

async function submitAuth(){
  const username = document.getElementById('auth-username').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if(!username || !password){ errEl.textContent = 'Enter a username and passphrase.'; return; }
  if(password.length < 4){ errEl.textContent = 'Passphrase must be at least 4 characters.'; return; }

  const users = (await storageGet('users')) || {};

  if(authMode === 'signup'){
    if(users[username]){ errEl.textContent = 'That username is already taken.'; return; }
    users[username] = { passwordHash: simpleHash(password), createdAt: new Date().toISOString() };
    await storageSet('users', users);
    await storageSet('records:'+username, []);
    await enterApp(username);
  } else {
    const u = users[username];
    if(!u || u.passwordHash !== simpleHash(password)){ errEl.textContent = 'Username or passphrase is incorrect.'; return; }
    await enterApp(username);
  }
}

async function enterApp(username){
  currentUser = username;
  records = (await storageGet('records:'+username)) || [];
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('sidebar-who').innerHTML = username + '<span>Signed in</span>';
  setView('dashboard');
}

function logout(){
  currentUser = null;
  records = [];
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-username').value = '';
  document.getElementById('auth-password').value = '';
}

/* ============================================================
   NAV
============================================================ */
function setView(view){
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  render();
}

/* ============================================================
   DATA HELPERS
============================================================ */
function monthOf(dateStr){ return dateStr.slice(0,7); }
function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '₹' + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits: 0});
}
function recordsForMonth(month){ return records.filter(r => monthOf(r.date) === month); }
function sumBy(recs, type){ return recs.filter(r=>r.type===type).reduce((s,r)=>s+r.amount,0); }
function categoryBreakdown(recs, type){
  const map = {};
  recs.filter(r=>r.type===type).forEach(r=>{ map[r.category] = (map[r.category]||0) + r.amount; });
  return map;
}
function monthLabel(m){
  const [y,mo] = m.split('-');
  return new Date(y, mo-1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'});
}
function last6Months(){
  const arr = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    arr.push(d.toISOString().slice(0,7));
  }
  return arr;
}

async function persistRecords(){ await storageSet('records:'+currentUser, records); }

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  const main = document.getElementById('main-content');
  if(currentView === 'dashboard') main.innerHTML = renderDashboard();
  else if(currentView === 'add') main.innerHTML = renderAddEntry();
  else if(currentView === 'records') main.innerHTML = renderRecords();
  else if(currentView === 'analyzer') main.innerHTML = renderAnalyzer();

  if(currentView === 'dashboard') setTimeout(drawDashboardCharts, 0);
  if(currentView === 'add') setupAddEntryHandlers();
  if(currentView === 'records') setupRecordsHandlers();
  if(currentView === 'analyzer') setupAnalyzerHandlers();
}

/* ============================================================
   DASHBOARD
============================================================ */
function renderDashboard(){
  const recs = recordsForMonth(selectedMonth);
  const income = sumBy(recs,'income');
  const expense = sumBy(recs,'expense');
  const savings = sumBy(recs,'savings');
  const balance = income - expense - savings;
  const recent = [...records].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6);

  return `
    <div class="page-head">
      <h2>Dashboard</h2>
      <div class="stamp">${monthLabel(selectedMonth)}</div>
    </div>

    <div class="grid-cards">
      <div class="card"><div class="label">Income</div><div class="amount mono credit">${fmtMoney(income)}</div></div>
      <div class="card"><div class="label">Expenses</div><div class="amount mono debit">${fmtMoney(expense)}</div></div>
      <div class="card"><div class="label">Savings set aside</div><div class="amount mono" style="color:var(--gold)">${fmtMoney(savings)}</div></div>
      <div class="card"><div class="label">Balance</div><div class="amount mono" style="color:${balance>=0?'var(--sage)':'var(--brick)'}">${fmtMoney(balance)}</div></div>
    </div>

    <div class="row2">
      <div class="panel">
        <h3>Where expenses went</h3>
        ${expense>0 ? '<div class="chart-wrap"><canvas id="chart-expense-pie"></canvas></div>' : '<div class="empty"><div class="big">No expenses logged yet</div>Add an entry to see the breakdown.</div>'}
      </div>
      <div class="panel">
        <h3>Six-month trend</h3>
        <div class="chart-wrap"><canvas id="chart-trend"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3>Recent entries</h3>
      ${recent.length ? `
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th class="amt">Amount</th></tr></thead>
        <tbody>
          ${recent.map(r=>`
            <tr>
              <td class="mono">${r.date}</td>
              <td><span class="type-pill ${r.type}">${r.type}</span></td>
              <td>${r.category}</td>
              <td class="amt mono ${r.type==='expense'?'debit':'credit'}">${fmtMoney(r.amount)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty"><div class="big">The ledger is empty</div>Your first entry starts the record.</div>`}
    </div>
  `;
}

function drawDashboardCharts(){
  const recs = recordsForMonth(selectedMonth);
  const pieCanvas = document.getElementById('chart-expense-pie');
  if(pieCanvas){
    const breakdown = categoryBreakdown(recs, 'expense');
    new Chart(pieCanvas, {
      type: 'doughnut',
      data: {
        labels: Object.keys(breakdown),
        datasets: [{
          data: Object.values(breakdown),
          backgroundColor: ['#c9a227','#c3705a','#7fae93','#8b6fb3','#5a8fb8','#b8905a','#7a7a5a','#a15a7a','#5a9a7a','#9a5a5a'],
          borderColor: '#1b241a', borderWidth: 2
        }]
      },
      options: {
        plugins: { legend: { position:'bottom', labels:{ color:'#ede6d6', font:{family:'Inter', size:11}, boxWidth:10 } } },
        cutout: '62%'
      }
    });
  }

  const trendCanvas = document.getElementById('chart-trend');
  if(trendCanvas){
    const months = last6Months();
    const incomeData = months.map(m => sumBy(recordsForMonth(m), 'income'));
    const expenseData = months.map(m => sumBy(recordsForMonth(m), 'expense'));
    new Chart(trendCanvas, {
      type: 'bar',
      data: {
        labels: months.map(m => monthLabel(m).split(' ')[0].slice(0,3)),
        datasets: [
          { label:'Income', data: incomeData, backgroundColor:'#7fae93' },
          { label:'Expense', data: expenseData, backgroundColor:'#c3705a' }
        ]
      },
      options: {
        scales: {
          x: { ticks:{color:'#b7ae9c', font:{family:'IBM Plex Mono', size:10.5}}, grid:{color:'rgba(237,230,214,0.06)'} },
          y: { ticks:{color:'#b7ae9c', font:{family:'IBM Plex Mono', size:10.5}}, grid:{color:'rgba(237,230,214,0.06)'} }
        },
        plugins: { legend: { position:'bottom', labels:{ color:'#ede6d6', font:{family:'Inter', size:11}, boxWidth:10 } } }
      }
    });
  }
}

/* ============================================================
   ADD ENTRY
============================================================ */
function catsForType(t){ return t==='income'?INCOME_CATS : t==='savings'?SAVINGS_CATS : EXPENSE_CATS; }

function renderAddEntry(){
  const today = new Date().toISOString().slice(0,10);
  return `
    <div class="page-head"><h2>Add Entry</h2></div>
    <div class="panel" style="max-width:560px;">
      <h3>New ledger line</h3>
      <div class="field">
        <label>Entry type</label>
        <div class="type-select">
          <div class="type-opt sel-income ${draftType==='income'?'active':''}" data-type="income">Income</div>
          <div class="type-opt sel-expense ${draftType==='expense'?'active':''}" data-type="expense">Expense</div>
          <div class="type-opt sel-savings ${draftType==='savings'?'active':''}" data-type="savings">Savings</div>
        </div>
      </div>
      <div class="form-grid">
        <div class="field">
          <label>Category</label>
          <select id="entry-category">
            ${catsForType(draftType).map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input id="entry-amount" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label>Date</label>
          <input id="entry-date" type="date" value="${today}">
        </div>
        <div class="field">
          <label>Note (optional)</label>
          <input id="entry-note" placeholder="e.g. groceries at the market">
        </div>
      </div>
      <button class="btn-primary" style="margin-top:8px;" onclick="submitEntry()">Add to ledger</button>
      <div class="auth-error" id="entry-error"></div>
    </div>
  `;
}

function setupAddEntryHandlers(){
  document.querySelectorAll('.type-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      draftType = el.dataset.type;
      render();
    });
  });
}

async function submitEntry(){
  const category = document.getElementById('entry-category').value;
  const amount = parseFloat(document.getElementById('entry-amount').value);
  const date = document.getElementById('entry-date').value;
  const note = document.getElementById('entry-note').value.trim();
  const errEl = document.getElementById('entry-error');

  if(!amount || amount <= 0){ errEl.textContent = 'Enter an amount greater than zero.'; return; }
  if(!date){ errEl.textContent = 'Choose a date.'; return; }

  records.push({
    id: 'r'+Date.now()+Math.random().toString(36).slice(2,7),
    type: draftType, category, amount, date, note
  });
  await persistRecords();
  setView('records');
}

/* ============================================================
   RECORDS
============================================================ */
let filterType = 'all';
let filterMonth = 'all';

function renderRecords(){
  const months = [...new Set(records.map(r=>monthOf(r.date)))].sort().reverse();
  let filtered = [...records];
  if(filterType !== 'all') filtered = filtered.filter(r=>r.type===filterType);
  if(filterMonth !== 'all') filtered = filtered.filter(r=>monthOf(r.date)===filterMonth);
  filtered.sort((a,b)=> b.date.localeCompare(a.date));

  const totalIn = sumBy(filtered,'income');
  const totalOut = sumBy(filtered,'expense') + sumBy(filtered,'savings');

  return `
    <div class="page-head"><h2>Records</h2><div class="stamp">${filtered.length} ${filtered.length===1?'entry':'entries'}</div></div>
    <div class="filters">
      <select id="filter-type">
        <option value="all">All types</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
        <option value="savings">Savings</option>
      </select>
      <select id="filter-month">
        <option value="all">All months</option>
        ${months.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      ${filtered.length ? `
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th class="amt">Amount</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(r=>`
            <tr>
              <td class="mono">${r.date}</td>
              <td><span class="type-pill ${r.type}">${r.type}</span></td>
              <td>${r.category}</td>
              <td style="color:var(--parchment-dim)">${r.note||'—'}</td>
              <td class="amt mono ${r.type==='expense'?'debit':'credit'}">${fmtMoney(r.amount)}</td>
              <td><button class="del-btn" onclick="deleteRecord('${r.id}')">✕</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      ` : `<div class="empty"><div class="big">Nothing matches this filter</div>Try another type or month.</div>`}
    </div>
  `;
}

function setupRecordsHandlers(){
  const typeSel = document.getElementById('filter-type');
  const monthSel = document.getElementById('filter-month');
  if(typeSel){ typeSel.value = filterType; typeSel.addEventListener('change', e=>{ filterType = e.target.value; render(); }); }
  if(monthSel){ monthSel.value = filterMonth; monthSel.addEventListener('change', e=>{ filterMonth = e.target.value; render(); }); }
}

async function deleteRecord(id){
  records = records.filter(r=>r.id!==id);
  await persistRecords();
  render();
}

/* ============================================================
   ANALYZER (AI-powered)
============================================================ */
let lastAnalysis = null;
let analyzerMonth = new Date().toISOString().slice(0,7);

function renderAnalyzer(){
  const recs = recordsForMonth(analyzerMonth);
  const autoIncome = sumBy(recs, 'income');
  const expenseBreakdown = categoryBreakdown(recs, 'expense');
  const totalExpense = sumBy(recs, 'expense');
  const months = [...new Set(records.map(r=>monthOf(r.date)))].sort().reverse();
  if(!months.includes(analyzerMonth)) months.unshift(analyzerMonth);

  return `
    <div class="page-head"><h2>Analyzer</h2><div class="stamp">AI-assisted</div></div>

    <div class="panel">
      <h3>Set the month to analyze</h3>
      <div class="form-grid">
        <div class="field">
          <label>Month</label>
          <select id="analyzer-month">
            ${months.map(m=>`<option value="${m}" ${m===analyzerMonth?'selected':''}>${monthLabel(m)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Monthly income (₹) — auto-filled, editable</label>
          <input id="analyzer-income" type="number" min="0" step="0.01" value="${autoIncome || ''}" placeholder="Enter your monthly income">
        </div>
      </div>

      <h3 style="margin-top:22px;">Expense breakdown this month</h3>
      ${Object.keys(expenseBreakdown).length ? `
        <table>
          <thead><tr><th>Category</th><th class="amt">Amount</th><th class="amt">Share</th></tr></thead>
          <tbody>
            ${Object.entries(expenseBreakdown).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
              <tr><td>${cat}</td><td class="amt mono debit">${fmtMoney(amt)}</td><td class="amt mono">${totalExpense? Math.round(amt/totalExpense*100):0}%</td></tr>
            `).join('')}
          </tbody>
        </table>
      ` : `<div class="empty"><div class="big">No expenses logged for this month</div>Add entries to get a tailored analysis.</div>`}

      <button class="btn-primary" style="margin-top:18px; max-width:260px;" id="analyze-btn" onclick="runAnalysis()">Analyze my spending</button>
      <div id="analysis-status" style="margin-top:12px;"></div>
      <div id="analysis-result"></div>
    </div>
  `;
}

function setupAnalyzerHandlers(){
  const monthSel = document.getElementById('analyzer-month');
  if(monthSel){ monthSel.addEventListener('change', e=>{ analyzerMonth = e.target.value; render(); }); }
  if(lastAnalysis && lastAnalysis.month === analyzerMonth){ renderAnalysisResult(lastAnalysis.data); }
}

async function runAnalysis(){
  const incomeInput = document.getElementById('analyzer-income');
  const income = parseFloat(incomeInput.value);
  const statusEl = document.getElementById('analysis-status');
  const resultEl = document.getElementById('analysis-result');
  resultEl.innerHTML = '';

  if(!income || income <= 0){
    statusEl.innerHTML = '<div class="err-line">Enter your monthly income to run an analysis.</div>';
    return;
  }

  const recs = recordsForMonth(analyzerMonth);
  const expenseBreakdown = categoryBreakdown(recs, 'expense');
  const savingsTotal = sumBy(recs, 'savings');
  const totalExpense = sumBy(recs, 'expense');

  statusEl.innerHTML = '<div class="loading-line">Reviewing the ledger…</div>';
  document.getElementById('analyze-btn').disabled = true;

  const payload = {
    monthly_income: income,
    total_expenses: totalExpense,
    total_savings: savingsTotal,
    expense_breakdown: expenseBreakdown,
    month: analyzerMonth
  };

  const systemPrompt = `You are a careful, practical personal finance advisor. You will receive a JSON object describing a person's monthly income, their expense breakdown by category, and their savings for the month. 
Respond with ONLY a raw JSON object (no markdown fences, no prose outside the JSON) with exactly this shape:
{
  "assessment": "2-3 sentence plain-language assessment of their spending relative to income",
  "recommended_budget": { "CategoryName": recommendedMonthlyAmountNumber, ... },
  "savings_rate_recommendation": "1-2 sentences on what portion of income they should be saving and why",
  "tips": ["short actionable tip", "short actionable tip", "short actionable tip"]
}
Base recommended_budget categories on the categories actually present in their expense_breakdown (plus a savings line if useful). Keep numbers realistic relative to the stated income. Do not include any currency symbols in the numbers, just plain numbers.`;

  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [ { role:'user', content: JSON.stringify(payload) } ]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    const cleaned = textBlock.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    lastAnalysis = { month: analyzerMonth, data: parsed };
    statusEl.innerHTML = '';
    renderAnalysisResult(parsed);
  } catch(e){
    console.error(e);
    statusEl.innerHTML = '<div class="err-line">The analysis could not be completed. Please try again.</div>';
  } finally {
    document.getElementById('analyze-btn').disabled = false;
  }
}

function renderAnalysisResult(data){
  const resultEl = document.getElementById('analysis-result');
  if(!resultEl) return;
  const maxBudget = Math.max(...Object.values(data.recommended_budget||{1:1}));
  resultEl.innerHTML = `
    <div class="ai-box">
      <h4>Assessment</h4>
      <p style="font-size:13.5px; line-height:1.5; margin:0 0 16px;">${data.assessment||''}</p>

      <h4>Recommended monthly budget</h4>
      ${Object.entries(data.recommended_budget||{}).map(([cat,amt])=>`
        <div class="budget-bar-row">
          <div class="bblabel"><span>${cat}</span><span class="mono">${fmtMoney(amt)}</span></div>
          <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${maxBudget? (amt/maxBudget*100):0}%"></div></div>
        </div>
      `).join('')}

      <h4 style="margin-top:16px;">Savings guidance</h4>
      <p style="font-size:13.5px; line-height:1.5; margin:0 0 16px;">${data.savings_rate_recommendation||''}</p>

      <h4>Tips</h4>
      ${(data.tips||[]).map(t=>`<div class="ai-tip"><span class="bullet">→</span><span>${t}</span></div>`).join('')}
    </div>
  `;
}

/* ============================================================
   INIT
============================================================ */
document.getElementById('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAuth(); });
document.getElementById('auth-username').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAuth(); });
</script>
